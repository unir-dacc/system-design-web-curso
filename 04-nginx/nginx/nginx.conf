# Configuração geral do Nginx. As regras do Ingressa ficam em
# templates/ingressa.conf.template.

user nginx;

# Um único processo: o Nginx atende milhares de conexões num só event loop,
# a mesma ideia do async da aula 03, só que escrito em C.
worker_processes 1;
worker_rlimit_nofile 65536;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 20000;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Sem log de cada requisição: no pico seriam milhares por segundo
    access_log off;

    keepalive_timeout 65;

    include /etc/nginx/conf.d/ingressa.conf;
}
