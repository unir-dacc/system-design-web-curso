# Etapa 02 - Cache do mapa de assentos
#
# Orçamento de hardware do Ingressa nesta etapa:
#   app:      1 CPU / 512 MB  (1 processo uvicorn, igual à etapa 01)
#   postgres: 1 CPU / 512 MB  (igual à etapa 01)
#   redis:    0.25 CPU / 64 MB (novo)
# Os sistemas externos vêm de ../shared/compose.externos.yml e são iguais em todas as etapas.

name: ingressa

include:
  - ../shared/compose.externos.yml

services:
  ingressa:
    build: .
    # Limite de arquivos abertos do processo (cada conexão de rede conta como um).
    # Fixado aqui para que o resultado seja o mesmo em qualquer máquina.
    ulimits:
      nofile: 1024
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Tempo de vida do mapa no cache. Para testar outro valor:
      #   MAPA_TTL_S=5 docker compose up -d ingressa
      MAPA_TTL_S: ${MAPA_TTL_S:-30}
    volumes:
      - ../shared/seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sistema-cinema:
        condition: service_healthy
      gateway-pagamento:
        condition: service_healthy
      mailpit:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7.4-alpine
    # Só cache: nada é gravado em disco
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ingressa
      POSTGRES_PASSWORD: ingressa
      POSTGRES_DB: ingressa
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ingressa"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # Gerador de carga. Não sobe com "up"; é usado com:
  #   docker compose run --rm --service-ports k6 run /scripts/estreia.js
  # Painel em tempo real: http://localhost:5665 (o --service-ports publica a porta)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    # Roda com o seu usuário para conseguir salvar o relatório em ./relatorios
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:5665:5665"
    volumes:
      - ../shared/load-tests:/scripts:ro
      - ./relatorios:/relatorios
    environment:
      BASE_URL: http://ingressa:8000
      ETAPA: "Etapa 02 · Cache do mapa"
      # Ao final, o painel é salvo em relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD_EXPORT: /relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PERIOD: 2s
      # Avisos de requisições que falharam vão para um arquivo, não para a tela
      K6_LOG_OUTPUT: file=/relatorios/k6.log
    deploy:
      resources:
        limits:
          cpus: "2.0"
