# O Nginx é a porta de entrada do encurtador: recebe todas as conexões dos
# usuários e distribui as requisições entre os backends.

user nginx;

# Um único processo: o Nginx atende milhares de conexões num só event loop.
worker_processes 1;
worker_rlimit_nofile 65536;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 20000;
}

http {
    # Sem log de cada requisição: no pico seriam milhares por segundo
    access_log off;
    keepalive_timeout 65;

    # Os backends. "app" é o nome do serviço no docker-compose.yml: com
    # "replicas: 3", o Docker devolve o endereço de todos, e o Nginx alterna
    # as requisições entre eles. O DNS do Docker (127.0.0.11) é consultado de
    # novo a cada 5 s: se um backend for recriado (com outro endereço) ou se
    # entrar mais um (--scale), o Nginx fica sabendo sozinho.
    resolver 127.0.0.11 valid=5s;
    upstream encurtador {
        zone backends 64k;
        server app:8000 resolve;
        # Reaproveita as conexões com os backends em vez de abrir uma por requisição
        keepalive 64;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://encurtador;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Os backends respondem rápido ou desistem (limites de tempo da etapa 02)
            proxy_read_timeout 30s;
        }
    }
}
