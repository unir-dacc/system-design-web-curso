# Encurtador de URL - Etapa 03 - Nginx na frente de 3 backends
#
# Orçamento do encurtador: 2 CPUs e 2 GB no total, iguais em todas as etapas.
# Nesta etapa, eles ficam assim:
#   nginx:    0.2 CPU / 128 MB          (novo: a porta de entrada)
#   app:      0.4 CPU / 384 MB, cada um (3 backends: 1,2 CPU no total)
#   postgres: 0.6 CPU / 768 MB          (usava pouco do que tinha)

name: encurtador

services:
  # A porta de entrada: todo acesso passa pelo Nginx, que distribui as
  # requisições entre os backends.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ulimits:
      nofile: 65536
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  # Os backends: o encurtador da etapa 02, em 3 cópias iguais. Nenhum guarda
  # estado na própria memória (tudo está no Postgres), então qualquer um pode
  # atender qualquer requisição.
  # Para testar outro número: docker compose up -d --scale app=4
  app:
    build: .
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.4"
          memory: 384M
    # Limite de arquivos abertos do processo (cada conexão de rede conta como um).
    # Fixado aqui para que o resultado seja o mesmo em qualquer máquina.
    ulimits:
      nofile: 1024
    # Sem porta publicada: só o Nginx fala com os backends
    environment:
      # Quantos links já existem quando a aula começa (criados na primeira subida)
      LINKS_INICIAIS: ${LINKS_INICIAIS:-1000000}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador
      POSTGRES_DB: encurtador
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "encurtador"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.6"
          memory: 768M

  # Gerador de carga. Não sobe com "up"; é usado com:
  #   docker compose run --rm --service-ports k6 run /scripts/movimento.js
  # Painel em tempo real: http://localhost:5665 (o --service-ports publica a porta)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    # Roda com o seu usuário para conseguir salvar o relatório em ./relatorios
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:5665:5665"
    volumes:
      - ../shared/load-tests:/scripts:ro
      - ./relatorios:/relatorios
      # Só leitura: o relatório compara com o último resultado das etapas anteriores
      - ..:/curso:ro
    environment:
      # O teste entra pela porta da frente, como um usuário
      BASE_URL: http://nginx:80
      ETAPA: "Etapa 03 · Nginx"
      # Ao final, o painel é salvo em relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD_EXPORT: /relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PERIOD: 2s
      # Avisos de requisições que falharam vão para um arquivo, não para a tela
      K6_LOG_OUTPUT: file=/relatorios/k6.log
