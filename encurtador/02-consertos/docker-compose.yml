# Encurtador de URL - Etapa 02 - Consertos
#
# Orçamento do encurtador: 2 CPUs e 2 GB no total, iguais em todas as etapas.
# Nesta etapa, eles ficam assim:
#   app:      1 CPU / 1 GB    (1 processo uvicorn, igual à etapa 01)
#   postgres: 1 CPU / 1 GB    (igual à etapa 01)

name: encurtador

services:
  app:
    build: .
    # Limite de arquivos abertos do processo (cada conexão de rede conta como um).
    # Fixado aqui para que o resultado seja o mesmo em qualquer máquina.
    ulimits:
      nofile: 1024
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Quantos links já existem quando a aula começa (criados na primeira subida)
      LINKS_INICIAIS: ${LINKS_INICIAIS:-1000000}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: encurtador
      POSTGRES_PASSWORD: encurtador
      POSTGRES_DB: encurtador
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "encurtador"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Gerador de carga. Não sobe com "up"; é usado com:
  #   docker compose run --rm --service-ports k6 run /scripts/movimento.js
  # Painel em tempo real: http://localhost:5665 (o --service-ports publica a porta)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    # Roda com o seu usuário para conseguir salvar o relatório em ./relatorios
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:5665:5665"
    volumes:
      - ../shared/load-tests:/scripts:ro
      - ./relatorios:/relatorios
      # Só leitura: o relatório compara com o último resultado das etapas anteriores
      - ..:/curso:ro
    environment:
      BASE_URL: http://app:8000
      ETAPA: "Etapa 02 · Consertos"
      # Ao final, o painel é salvo em relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD_EXPORT: /relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PERIOD: 2s
      # Avisos de requisições que falharam vão para um arquivo, não para a tela
      K6_LOG_OUTPUT: file=/relatorios/k6.log
