# Etapa 07 - A borda (CDN): a etapa 06 com um microcache e o passe conferido no Nginx
#
# Orçamento do Ingressa: 2 CPUs e 2 GB no total, iguais em todas as etapas.
# Nesta etapa, eles ficam assim:
#   nginx:    0.2 CPU  / 128 MB          (igual à etapa 06, agora também a borda: microcache e passe)
#   ingressa: 0.5 CPU  / 384 MB, cada um (2 backends, igual à etapa 05)
#   worker:   0.3 CPU  / 256 MB          (igual à etapa 06; o porteiro libera o dobro de gente por segundo)
#   postgres: 0.25 CPU / 640 MB          (igual à etapa 05)
#   redis:    0.25 CPU / 256 MB          (igual à etapa 02)
# Os sistemas externos vêm de ../shared/compose.externos.yml e são iguais em todas as etapas.

name: ingressa

include:
  - ../shared/compose.externos.yml

services:
  # A porta de entrada: todo acesso passa pelo Nginx, que distribui as
  # requisições entre os backends e limita quantas ficam em andamento.
  # Para testar outro limite:
  #   MAX_COMPRAS_SIMULTANEAS=10 docker compose up -d nginx
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/njs:/etc/nginx/njs:ro
    environment:
      # O mesmo segredo dos backends: a borda confere o passe sem chamar o Python
      SEGREDO_DA_SALA: ${SEGREDO_DA_SALA:-troque-em-producao}
      # Quantas requisições de cada endpoint podem estar em andamento ao mesmo tempo
      MAX_PROGRAMACAO_SIMULTANEAS: ${MAX_PROGRAMACAO_SIMULTANEAS:-200}
      MAX_MAPAS_SIMULTANEOS: ${MAX_MAPAS_SIMULTANEOS:-150}
      MAX_PEDIDOS_SIMULTANEOS: ${MAX_PEDIDOS_SIMULTANEOS:-100}
      MAX_COMPRAS_SIMULTANEAS: ${MAX_COMPRAS_SIMULTANEAS:-60}
      MAX_OUTROS_SIMULTANEOS: ${MAX_OUTROS_SIMULTANEOS:-50}
      MAX_SALA_SIMULTANEOS: ${MAX_SALA_SIMULTANEOS:-300}
    ulimits:
      nofile: 65536
    depends_on:
      ingressa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  # Os backends: o Ingressa em 2 cópias iguais. Nenhum guarda
  # estado na própria memória (o cache está no Redis, os pedidos no Postgres),
  # então qualquer um pode atender qualquer requisição.
  # Para testar outro número: docker compose up -d --scale ingressa=3
  ingressa:
    build: .
    environment:
      SEGREDO_DA_SALA: ${SEGREDO_DA_SALA:-troque-em-producao}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
    # Limite de arquivos abertos do processo (cada conexão de rede conta como um).
    # Fixado aqui para que o resultado seja o mesmo em qualquer máquina.
    ulimits:
      nofile: 1024
    # Sem porta publicada: só o Nginx fala com os backends
    volumes:
      - ../shared/seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sistema-cinema:
        condition: service_healthy
      gateway-pagamento:
        condition: service_healthy
      mailpit:
        condition: service_started

  # O worker: o mesmo código dos backends, rodando app/worker.py. Tira as
  # compras da fila (no Redis) e conclui cada uma: cobra, confirma, emite os
  # ingressos e manda o e-mail. Também roda o porteiro da sala de espera.
  # Só um: ao subir, ele devolve para a fila as
  # compras que ficaram pela metade, e com dois um poderia pegar as do outro.
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    # O teste de saúde do Dockerfile é o dos backends (HTTP); o worker não tem servidor
    healthcheck:
      disable: true
    environment:
      WORKER_THREADS: 40
      # O porteiro da sala de espera: quantas pessoas entram por segundo. Para testar:
      #   LIBERAR_POR_SEGUNDO=30 docker compose up -d worker
      # O dobro da etapa 06: com a borda respondendo as páginas, os backends
      # aguentam mais gente lá dentro
      LIBERAR_POR_SEGUNDO: ${LIBERAR_POR_SEGUNDO:-120}
      # Ele devolve a conexão do banco antes de esperar o gateway: precisa de poucas
      DB_POOL: 10
    volumes:
      - ../shared/seed:/seed:ro
    depends_on:
      ingressa:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

  postgres:
    image: postgres:16-alpine
    # pg_stat_statements: o Postgres guarda, para cada consulta, quantas vezes
    # rodou e quanto tempo levou (é o que o pgHero mostra)
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    # A memória compartilhada do container (/dev/shm). O padrão do Docker, 64 MB,
    # não basta para o VACUUM e as consultas em paralelo do Postgres
    shm_size: 256mb
    environment:
      POSTGRES_USER: ingressa
      POSTGRES_PASSWORD: ingressa
      POSTGRES_DB: ingressa
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ingressa"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 640M

  redis:
    image: redis:7.4-alpine
    # Agora o Redis guarda também a fila de compras, que não pode se perder:
    # - appendonly: cada mudança é gravada em disco, e volta se o Redis reiniciar
    # - volatile-lru: quando a memória enche, só descarta o que tem prazo de
    #   validade (as respostas do cache), nunca a fila
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # Painel do banco: as consultas que mais gastam tempo, os índices, as tabelas.
  # Não sobe com "up"; é usado com:
  #   docker compose --profile observar up -d pghero
  # e fica em http://localhost:8080. Só lê estatísticas, então fica fora do
  # orçamento do Ingressa.
  pghero:
    image: ankane/pghero:v3.6.1
    profiles: ["observar"]
    environment:
      DATABASE_URL: postgres://ingressa:ingressa@postgres:5432/ingressa
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Gerador de carga. Não sobe com "up"; é usado com:
  #   docker compose run --rm --service-ports k6 run /scripts/estreia.js
  # Painel em tempo real: http://localhost:5665 (o --service-ports publica a porta)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    # Roda com o seu usuário para conseguir salvar o relatório em ./relatorios
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:5665:5665"
    volumes:
      - ../shared/load-tests:/scripts:ro
      - ./relatorios:/relatorios
      # Só leitura: o relatório compara com o último resultado das outras etapas
      - ..:/curso:ro
    environment:
      # O teste entra pela porta da frente, como um usuário
      BASE_URL: http://nginx:80
      ETAPA: "Etapa 07 · A borda (CDN)"
      # Uma estreia com o dobro do pico da etapa 06: com o pico de 120/s, a subida
      # para em 96/s, e a 06 já aguenta isso
      USUARIOS: 240
      # Ao final, o painel é salvo em relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD_EXPORT: /relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PERIOD: 2s
      # Avisos de requisições que falharam vão para um arquivo, não para a tela
      K6_LOG_OUTPUT: file=/relatorios/k6.log

volumes:
  redis:
