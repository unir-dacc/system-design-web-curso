<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6d28d9"/>
    </marker>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1000" height="360" rx="24" fill="#faf5ff"/>

  <!-- o público -->
  <g transform="translate(40 105)">
    <rect width="190" height="150" rx="18" fill="#ffffff" stroke="#f9a8d4" stroke-width="2" stroke-dasharray="7 6"/>
    <g fill="#ec4899">
      <circle cx="65" cy="45" r="11"/><path d="M47 78a18 15 0 0 1 36 0z"/>
      <circle cx="95" cy="38" r="13"/><path d="M74 78a21 18 0 0 1 42 0z"/>
      <circle cx="125" cy="45" r="11"/><path d="M107 78a18 15 0 0 1 36 0z"/>
    </g>
    <text x="95" y="112" text-anchor="middle" fill="#1e1b4b" font-size="19" font-weight="700">O público (k6)</text>
    <text x="95" y="134" text-anchor="middle" fill="#9d174d" font-size="14">fora do orçamento</text>
  </g>

  <line x1="236" y1="180" x2="322" y2="180" stroke="#6d28d9" stroke-width="3" marker-end="url(#seta)"/>
  <text x="279" y="168" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="600">HTTP</text>

  <!-- o orçamento -->
  <rect x="330" y="30" width="630" height="300" rx="22" fill="#ede9fe" fill-opacity="0.6" stroke="#a78bfa" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="520" y="14" width="250" height="34" rx="17" fill="#6d28d9"/>
  <text x="645" y="37" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">orçamento fixo: 2 CPUs · 2 GB</text>

  <!-- o app -->
  <g transform="translate(370 95)" filter="url(#sombra)">
    <rect width="230" height="170" rx="18" fill="#ffffff"/>
    <rect width="230" height="8" rx="4" fill="#8b5cf6"/>
    <text x="115" y="58" text-anchor="middle" fill="#6d28d9" font-size="30" font-weight="800">&lt;/&gt;</text>
    <text x="115" y="96" text-anchor="middle" fill="#1e1b4b" font-size="21" font-weight="700">Mural</text>
    <text x="115" y="122" text-anchor="middle" fill="#6b7280" font-size="15">FastAPI + SQLAlchemy</text>
    <text x="115" y="146" text-anchor="middle" fill="#6b7280" font-size="15">Python</text>
  </g>

  <line x1="606" y1="180" x2="712" y2="180" stroke="#6d28d9" stroke-width="3" marker-end="url(#seta)"/>
  <text x="659" y="168" text-anchor="middle" fill="#6d28d9" font-size="14" font-weight="600">SQL</text>

  <!-- o banco -->
  <g transform="translate(720 85)" filter="url(#sombra)">
    <path d="M0 30v130c0 17 45 30 100 30s100-13 100-30V30" fill="#ffffff"/>
    <ellipse cx="100" cy="30" rx="100" ry="30" fill="#c4b5fd"/>
    <path d="M0 75c0 17 45 30 100 30s100-13 100-30M0 118c0 17 45 30 100 30s100-13 100-30" fill="none" stroke="#ede9fe" stroke-width="3"/>
    <text x="100" y="98" text-anchor="middle" fill="#1e1b4b" font-size="21" font-weight="700">PostgreSQL</text>
    <text x="100" y="140" text-anchor="middle" fill="#6b7280" font-size="15">a rede inteira</text>
    <text x="100" y="161" text-anchor="middle" fill="#6b7280" font-size="15">aqui dentro</text>
  </g>

  <text x="645" y="306" text-anchor="middle" fill="#5b21b6" font-size="15">os ganhos vêm da arquitetura, nunca de máquina maior</text>
</svg>
