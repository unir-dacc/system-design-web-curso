<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6d28d9"/>
    </marker>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#4c1d95" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1000" height="400" rx="24" fill="#faf5ff"/>

  <!-- o público -->
  <g transform="translate(28 135)">
    <rect width="140" height="130" rx="18" fill="#ffffff" stroke="#f9a8d4" stroke-width="2" stroke-dasharray="7 6"/>
    <g fill="#ec4899">
      <circle cx="44" cy="40" r="9"/><path d="M29 67a15 13 0 0 1 30 0z"/>
      <circle cx="70" cy="34" r="11"/><path d="M52 67a18 15 0 0 1 36 0z"/>
      <circle cx="96" cy="40" r="9"/><path d="M81 67a15 13 0 0 1 30 0z"/>
    </g>
    <text x="70" y="97" text-anchor="middle" fill="#1e1b4b" font-size="17" font-weight="700">O público</text>
    <text x="70" y="117" text-anchor="middle" fill="#9d174d" font-size="13">k6</text>
  </g>
  <line x1="172" y1="200" x2="218" y2="200" stroke="#6d28d9" stroke-width="3" marker-end="url(#seta)"/>

  <!-- lado do app: sem limite -->
  <rect x="226" y="34" width="420" height="332" rx="22" fill="#ecfdf5" stroke="#34d399" stroke-width="2" stroke-dasharray="9 7"/>
  <rect x="331" y="18" width="210" height="32" rx="16" fill="#059669"/>
  <text x="436" y="40" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">CPU sem limite</text>

  <!-- nginx -->
  <g transform="translate(246 150)" filter="url(#sombra)">
    <rect width="104" height="100" rx="16" fill="#ffffff"/>
    <rect width="104" height="7" rx="3.5" fill="#10b981"/>
    <text x="52" y="52" text-anchor="middle" fill="#065f46" font-size="20" font-weight="800">nginx</text>
    <text x="52" y="76" text-anchor="middle" fill="#6b7280" font-size="13">distribui</text>
  </g>

  <!-- réplicas -->
  <g stroke="#6d28d9" stroke-width="2" fill="none">
    <path d="M352 200C380 200 380 92 412 92"/>
    <path d="M352 200C380 200 380 162 412 162"/>
    <path d="M352 200C380 200 380 238 412 238"/>
    <path d="M352 200C380 200 380 308 412 308"/>
  </g>
  <g font-size="15" filter="url(#sombra)">
    <g transform="translate(414 66)"><rect width="200" height="52" rx="12" fill="#ffffff"/><rect width="7" height="52" rx="3.5" fill="#8b5cf6"/><text x="20" y="23" fill="#1e1b4b" font-weight="700">Mural · réplica 1</text><text x="20" y="42" fill="#6b7280" font-size="13">FastAPI async · 4 processos</text></g>
    <g transform="translate(414 136)"><rect width="200" height="52" rx="12" fill="#ffffff"/><rect width="7" height="52" rx="3.5" fill="#8b5cf6"/><text x="20" y="23" fill="#1e1b4b" font-weight="700">Mural · réplica 2</text><text x="20" y="42" fill="#6b7280" font-size="13">FastAPI async · 4 processos</text></g>
    <g transform="translate(414 212)"><rect width="200" height="52" rx="12" fill="#ffffff"/><rect width="7" height="52" rx="3.5" fill="#8b5cf6"/><text x="20" y="23" fill="#1e1b4b" font-weight="700">Mural · réplica 3</text><text x="20" y="42" fill="#6b7280" font-size="13">FastAPI async · 4 processos</text></g>
    <g transform="translate(414 282)"><rect width="200" height="52" rx="12" fill="#ffffff"/><rect width="7" height="52" rx="3.5" fill="#8b5cf6"/><text x="20" y="23" fill="#1e1b4b" font-weight="700">Mural · réplica 4</text><text x="20" y="42" fill="#6b7280" font-size="13">FastAPI async · 4 processos</text></g>
  </g>

  <!-- até o banco -->
  <g stroke="#6d28d9" stroke-width="2" fill="none">
    <path d="M616 92C660 92 660 200 700 200"/>
    <path d="M616 162C660 162 660 200 700 200"/>
    <path d="M616 238C660 238 660 200 700 200"/>
    <path d="M616 308C660 308 660 200 700 200"/>
  </g>
  <line x1="700" y1="200" x2="728" y2="200" stroke="#6d28d9" stroke-width="3" marker-end="url(#seta)"/>

  <!-- o banco: o único com limite -->
  <rect x="736" y="34" width="240" height="332" rx="22" fill="#fdf2f8" stroke="#ec4899" stroke-width="2.5"/>
  <rect x="771" y="18" width="170" height="32" rx="16" fill="#db2777"/>
  <text x="856" y="40" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">1 CPU · 1 GB</text>
  <g transform="translate(766 105)" filter="url(#sombra)">
    <path d="M0 28v118c0 15 40 27 90 27s90-12 90-27V28" fill="#ffffff"/>
    <ellipse cx="90" cy="28" rx="90" ry="28" fill="#f9a8d4"/>
    <path d="M0 70c0 15 40 27 90 27s90-12 90-27M0 110c0 15 40 27 90 27s90-12 90-27" fill="none" stroke="#fce7f3" stroke-width="3"/>
    <text x="90" y="92" text-anchor="middle" fill="#1e1b4b" font-size="20" font-weight="700">PostgreSQL</text>
    <text x="90" y="132" text-anchor="middle" fill="#6b7280" font-size="14">a rede inteira</text>
    <text x="90" y="151" text-anchor="middle" fill="#6b7280" font-size="14">aqui dentro</text>
  </g>
  <text x="856" y="320" text-anchor="middle" fill="#9d174d" font-size="15" font-weight="700">o gargalo,</text>
  <text x="856" y="340" text-anchor="middle" fill="#9d174d" font-size="15" font-weight="700">de propósito</text>
</svg>
