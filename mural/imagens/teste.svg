<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="degrau" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pico" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="430" rx="24" fill="#faf5ff"/>
  <text x="40" y="52" fill="#1e1b4b" font-size="26" font-weight="800">Uma rodada, duas partes</text>

  <!-- eixo -->
  <line x1="60" y1="300" x2="960" y2="300" stroke="#c4b5fd" stroke-width="2"/>

  <!-- a subida: degraus crescentes -->
  <g fill="url(#degrau)">
    <rect x="70" y="290" width="64" height="10" rx="4"/>
    <rect x="142" y="278" width="64" height="22" rx="4"/>
    <rect x="214" y="262" width="64" height="38" rx="4"/>
    <rect x="286" y="240" width="64" height="60" rx="4"/>
    <rect x="358" y="208" width="64" height="92" rx="4"/>
    <rect x="430" y="172" width="64" height="128" rx="4"/>
    <rect x="502" y="134" width="64" height="166" rx="4"/>
    <rect x="574" y="100" width="64" height="200" rx="4"/>
  </g>
  <text x="352" y="330" text-anchor="middle" fill="#5b21b6" font-size="19" font-weight="700">1. A subida</text>
  <text x="352" y="354" text-anchor="middle" fill="#6b7280" font-size="15">degraus de 10 s: 2 por segundo, 5, 10, 20...</text>
  <text x="352" y="376" text-anchor="middle" fill="#6b7280" font-size="15">até onde o Mural continua viável?</text>

  <!-- o pico -->
  <rect x="660" y="74" width="290" height="226" rx="8" fill="url(#pico)"/>
  <g fill="#ffffff" fill-opacity="0.9">
    <path transform="translate(790 150) scale(1.6)" d="M12 21.4 10.6 20.1C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.6L12 21.4z"/>
  </g>
  <text x="805" y="232" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">1.000 por segundo</text>
  <text x="805" y="258" text-anchor="middle" fill="#ffffff" font-size="15">por 30 segundos</text>
  <text x="805" y="330" text-anchor="middle" fill="#9d174d" font-size="19" font-weight="700">2. O pico</text>
  <text x="805" y="354" text-anchor="middle" fill="#6b7280" font-size="15">todo mundo quer ver o post viral</text>
  <text x="805" y="376" text-anchor="middle" fill="#6b7280" font-size="15">quem espera desiste depois de 5 s</text>
</svg>
