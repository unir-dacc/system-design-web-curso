<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.8" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f0a2e" flood-opacity="0.45"/>
    </filter>
    <path id="coracao" d="M12 21.4 10.6 20.1C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.7 0 3.4.8 4.5 2.1C13.1 3.8 14.8 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.6L12 21.4z"/>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#fundo)"/>
  <rect width="1280" height="420" rx="28" fill="url(#brilho)"/>

  <!-- pontos da rede ao fundo -->
  <g stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5">
    <line x1="60" y1="360" x2="180" y2="300"/><line x1="180" y1="300" x2="300" y2="380"/>
    <line x1="180" y1="300" x2="120" y2="220"/><line x1="560" y1="40" x2="660" y2="90"/>
    <line x1="660" y1="90" x2="610" y2="170"/><line x1="660" y1="90" x2="740" y2="40"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.18">
    <circle cx="60" cy="360" r="5"/><circle cx="180" cy="300" r="9"/><circle cx="300" cy="380" r="4"/>
    <circle cx="120" cy="220" r="4"/><circle cx="560" cy="40" r="4"/><circle cx="660" cy="90" r="8"/>
    <circle cx="610" cy="170" r="4"/><circle cx="740" cy="40" r="5"/>
  </g>

  <!-- título -->
  <text x="72" y="150" fill="#ffffff" font-size="112" font-weight="800" letter-spacing="-3">Mural</text>
  <text x="76" y="205" fill="#fbcfe8" font-size="34" font-weight="600">o dia em que um post viralizou</text>
  <text x="76" y="262" fill="#ffffff" fill-opacity="0.9" font-size="22">Um lab de system design sobre os problemas</text>
  <text x="76" y="292" fill="#ffffff" fill-opacity="0.9" font-size="22">de banco de dados de uma rede social.</text>

  <!-- etiquetas -->
  <g font-size="17" font-weight="600" fill="#ffffff">
    <rect x="76" y="326" width="96" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="124" y="350" text-anchor="middle">índices</text>
    <rect x="182" y="326" width="72" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="218" y="350" text-anchor="middle">N+1</text>
    <rect x="264" y="326" width="122" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="325" y="350" text-anchor="middle">paginação</text>
    <rect x="396" y="326" width="122" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="457" y="350" text-anchor="middle">contadores</text>
    <rect x="528" y="326" width="96" height="36" rx="18" fill="#ffffff" fill-opacity="0.16"/>
    <text x="576" y="350" text-anchor="middle">réplicas</text>
  </g>

  <!-- o post viral -->
  <g transform="translate(800 70)" filter="url(#sombra)">
    <rect width="400" height="280" rx="22" fill="#ffffff"/>
    <circle cx="48" cy="52" r="24" fill="#a78bfa"/>
    <circle cx="48" cy="46" r="9" fill="#ffffff" fill-opacity="0.9"/>
    <path d="M32 68a16 12 0 0 1 32 0z" fill="#ffffff" fill-opacity="0.9"/>
    <text x="86" y="48" fill="#1e1b4b" font-size="19" font-weight="700">A Celebridade</text>
    <circle cx="232" cy="42" r="9" fill="#3b82f6"/>
    <path d="M227.5 42.5l3 3 5.5-6" stroke="#ffffff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="86" y="72" fill="#6b7280" font-size="15">agora mesmo · a mais seguida do Mural</text>
    <text x="28" y="122" fill="#111827" font-size="21">Vocês não vão acreditar no que</text>
    <text x="28" y="152" fill="#111827" font-size="21">aconteceu hoje...</text>
    <rect x="28" y="178" width="344" height="1.5" fill="#e5e7eb"/>
    <use href="#coracao" transform="translate(28 200) scale(1.3)" fill="#ec4899"/>
    <text x="66" y="225" fill="#ec4899" font-size="20" font-weight="700">curtindo...</text>
    <g fill="#9ca3af">
      <path d="M210 205h28a6 6 0 0 1 6 6v14a6 6 0 0 1-6 6h-18l-8 7v-7h-2a6 6 0 0 1-6-6v-14a6 6 0 0 1 6-6z"/>
    </g>
    <text x="252" y="225" fill="#6b7280" font-size="18" font-weight="600">comentando...</text>
  </g>

  <!-- corações subindo -->
  <g fill="#f9a8d4">
    <use href="#coracao" transform="translate(1190 40) scale(1.6)" fill-opacity="0.95"/>
    <use href="#coracao" transform="translate(1222 120) scale(1.1)" fill-opacity="0.7"/>
    <use href="#coracao" transform="translate(760 330) scale(1.3)" fill-opacity="0.8"/>
    <use href="#coracao" transform="translate(735 250) scale(0.9)" fill-opacity="0.55"/>
    <use href="#coracao" transform="translate(1160 360) scale(1.2)" fill-opacity="0.75"/>
    <use href="#coracao" transform="translate(1110 18) scale(0.8)" fill-opacity="0.5"/>
  </g>
</svg>
