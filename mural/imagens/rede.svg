  <text x="0" y="0" fill="#1e1b4b" font-size="30" font-weight="800">Uma rede desigual,</text>
  <text x="0" y="38" fill="#1e1b4b" font-size="30" font-weight="800">como as de verdade</text>
  <circle cx="16" cy="98" r="16" fill="#6d28d9"/>
  <text x="44" y="94" fill="#1e1b4b" font-size="18" font-weight="700">poucas celebridades</text>
  <text x="44" y="116" fill="#6b7280" font-size="16">com dezenas de milhares de seguidores</text>
  <circle cx="16" cy="168" r="11" fill="#ec4899"/>
  <text x="44" y="164" fill="#1e1b4b" font-size="18" font-weight="700">algumas contas médias</text>
  <text x="44" y="186" fill="#6b7280" font-size="16">com centenas</text>
  <circle cx="16" cy="234" r="6" fill="#c4b5fd"/>
  <text x="44" y="230" fill="#1e1b4b" font-size="18" font-weight="700">e a multidão</text>
  <text x="44" y="252" fill="#6b7280" font-size="16">que segue de 1 a 300 pessoas</text>
  <text x="0" y="314" fill="#6d28d9" font-size="17" font-weight="600">É aí que o banco sofre: cada feed</text>
  <text x="0" y="338" fill="#6d28d9" font-size="17" font-weight="600">cruza quem eu sigo com 1 milhão</text>
  <text x="0" y="362" fill="#6d28d9" font-size="17" font-weight="600">de posts.</text>
