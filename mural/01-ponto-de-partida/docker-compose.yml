# Mural - Etapa 01 - Ponto de partida
#
# O lado do app é robusto e não tem limite de CPU: o nginx distribui entre 4
# réplicas, cada uma com 4 processos. O que é escasso é o banco:
#   postgres: 1 CPU / 1 GB, igual em todas as etapas
# Assim, quem chega no limite é sempre o Postgres, e cada aula mexe nele.

name: mural

services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    deploy:
      replicas: 4
    # Cada conexão de rede é um arquivo aberto: o limite fica alto o bastante
    # para nunca ser ele o gargalo
    ulimits:
      nofile: 65536
    environment:
      # Conexões com o banco por processo: 4 réplicas × 4 processos × 5 = 80,
      # dentro do max_connections do Postgres (100)
      CONEXOES_POR_PROCESSO: 5
      # O tamanho da rede quando a aula começa (criada na primeira subida)
      USUARIOS_INICIAIS: ${USUARIOS_INICIAIS:-100000}
      POSTS_INICIAIS: ${POSTS_INICIAIS:-1000000}
      CURTIDAS_INICIAIS: ${CURTIDAS_INICIAIS:-5000000}
      COMENTARIOS_INICIAIS: ${COMENTARIOS_INICIAIS:-500000}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # O disco é SSD: ler um bloco fora de ordem custa quase o mesmo que ler em
    # sequência. O padrão do Postgres (4) é do tempo do disco giratório, e faz o
    # banco evitar o índice quando não precisaria.
    # pg_stat_statements: o Postgres guarda, para cada consulta, quantas vezes
    # rodou e quanto tempo levou (é o que o pgHero mostra)
    command: postgres -c random_page_cost=1.1 -c shared_preload_libraries=pg_stat_statements
    # A memória compartilhada do container (/dev/shm). O padrão do Docker, 64 MB,
    # não basta para o VACUUM e as consultas em paralelo do Postgres
    shm_size: 256mb
    environment:
      POSTGRES_USER: mural
      POSTGRES_PASSWORD: mural
      POSTGRES_DB: mural
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mural"]
      interval: 2s
      timeout: 2s
      retries: 15
    # O orçamento do banco: o mesmo em todas as etapas
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Painel do banco: as consultas que mais gastam tempo, os índices, as tabelas.
  # Não sobe com "up"; é usado com:
  #   docker compose --profile observar up -d pghero
  # e fica em http://localhost:8080. Só lê estatísticas, então fica fora do
  # orçamento do banco.
  pghero:
    image: ankane/pghero:v3.6.1
    profiles: ["observar"]
    environment:
      DATABASE_URL: postgres://mural:mural@postgres:5432/mural
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Gerador de carga. Não sobe com "up"; é usado com:
  #   docker compose run --rm --service-ports k6 run /scripts/viral.js
  # Painel em tempo real: http://localhost:5665 (o --service-ports publica a porta)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    # Roda com o seu usuário para conseguir salvar o relatório em ./relatorios
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:5665:5665"
    volumes:
      - ../shared/load-tests:/scripts:ro
      - ./relatorios:/relatorios
      # Só leitura: o relatório compara com o último resultado das etapas anteriores
      - ..:/curso:ro
    environment:
      BASE_URL: http://nginx
      ETAPA: "Etapa 01 · Ponto de partida"
      # O que é limitado nesta etapa (aparece na comparação entre etapas)
      HARDWARE: "Postgres 1 CPU / 1 GB"
      # Ao final, o painel é salvo em relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD_EXPORT: /relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PERIOD: 2s
      # Avisos de requisições que falharam vão para um arquivo, não para a tela
      K6_LOG_OUTPUT: file=/relatorios/k6.log
