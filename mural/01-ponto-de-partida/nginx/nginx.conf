# A porta de entrada do Mural: distribui as requisições entre as réplicas do app
worker_processes auto;
worker_rlimit_nofile 65536;

events {
    worker_connections 16384;
}

http {
    access_log off;

    upstream mural {
        # "app" resolve para todas as réplicas: o nginx reveza entre elas
        server app:8000;
        # Reaproveita as conexões com as réplicas, em vez de abrir uma por requisição
        keepalive 256;
        keepalive_timeout 4s;  # menos que os 5 s do uvicorn: quem fecha é o nginx
    }

    server {
        listen 80;

        location / {
            proxy_pass http://mural;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            # O app desiste do banco antes de 5 s e responde 503: isto é só uma rede de segurança
            proxy_read_timeout 15s;
        }

        # As rotas de apoio às aulas podem demorar (o reset apaga milhares de linhas)
        location /admin/ {
            proxy_pass http://mural;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 300s;
        }
    }
}
