# Etapa 08 - A etapa 07 reescrita em Go
#
# A mesma arquitetura, o mesmo hardware (8 CPUs e 8 GB) e o mesmo teste da
# etapa 07 (pico de 600 usuários por segundo). Muda só a linguagem: o
# Ingressa (backends e worker) foi reescrito em Go, com as mesmas rotas, as
# mesmas respostas e as mesmas regras.
#   nginx:    0.5 CPU / 256 MB
#   ingressa: 0.8 CPU / 768 MB, cada um (6 backends: 4,8 CPU no total)
#   worker:   1.2 CPU / 768 MB          (150 trabalhadores; o porteiro libera 250 pessoas por segundo)
#   postgres: 1.0 CPU / 2 GB
#   redis:    0.5 CPU / 512 MB
# Os sistemas externos vêm de ../shared/compose.externos.yml e são iguais em todas as etapas.

name: ingressa

include:
  - ../shared/compose.externos.yml

services:
  # A porta de entrada: todo acesso passa pelo Nginx, que distribui as
  # requisições entre os backends e limita quantas ficam em andamento.
  # Para testar outro limite:
  #   MAX_COMPRAS_SIMULTANEAS=10 docker compose up -d nginx
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    environment:
      # Quantas requisições de cada endpoint podem estar em andamento ao mesmo tempo
      MAX_PROGRAMACAO_SIMULTANEAS: ${MAX_PROGRAMACAO_SIMULTANEAS:-1000}
      MAX_MAPAS_SIMULTANEOS: ${MAX_MAPAS_SIMULTANEOS:-750}
      MAX_PEDIDOS_SIMULTANEOS: ${MAX_PEDIDOS_SIMULTANEOS:-500}
      MAX_COMPRAS_SIMULTANEAS: ${MAX_COMPRAS_SIMULTANEAS:-300}
      MAX_OUTROS_SIMULTANEOS: ${MAX_OUTROS_SIMULTANEOS:-250}
      MAX_SALA_SIMULTANEOS: ${MAX_SALA_SIMULTANEOS:-1500}
    ulimits:
      nofile: 65536
    depends_on:
      ingressa:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Os backends: o Ingressa em Go, em 6 cópias. Nenhum guarda
  # estado na própria memória (o cache está no Redis, os pedidos no Postgres),
  # então qualquer um pode atender qualquer requisição.
  # Para testar outro número: docker compose up -d --scale ingressa=3
  ingressa:
    build: .
    deploy:
      replicas: 6
      resources:
        limits:
          cpus: "0.8"
          memory: 768M
    # Limite de arquivos abertos do processo (cada conexão de rede conta como um).
    # Nas outras etapas é 1024, fixado para o resultado ser igual em qualquer
    # máquina. Com 600 usuários por segundo, cada backend chega a centenas de
    # conexões ao mesmo tempo, e 1024 estoura: aqui fica o valor comum em produção.
    ulimits:
      nofile: 65536
    # Sem porta publicada: só o Nginx fala com os backends
    volumes:
      - ../shared/seed:/seed:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sistema-cinema:
        condition: service_healthy
      gateway-pagamento:
        condition: service_healthy
      mailpit:
        condition: service_started

  # O worker: o mesmo binário dos backends, rodando "ingressa worker". Tira as
  # compras da fila (no Redis) e conclui cada uma: cobra, confirma, emite os
  # ingressos e manda o e-mail. Também roda o porteiro da sala de espera.
  # Só um: ao subir, ele devolve para a fila as
  # compras que ficaram pela metade, e com dois um poderia pegar as do outro.
  worker:
    build: .
    command: ["/ingressa", "worker"]
    # O teste de saúde do Dockerfile é o dos backends (HTTP); o worker não tem servidor
    healthcheck:
      disable: true
    environment:
      WORKER_THREADS: 150
      # O porteiro da sala de espera: quantas pessoas entram por segundo. Para testar:
      #   LIBERAR_POR_SEGUNDO=30 docker compose up -d worker
      LIBERAR_POR_SEGUNDO: ${LIBERAR_POR_SEGUNDO:-250}
      # Ele devolve a conexão do banco antes de esperar o gateway: precisa de poucas
      DB_POOL: 20
      # Cada trabalhador espera a fila com uma conexão própria com o Redis
      REDIS_POOL: 200
    volumes:
      - ../shared/seed:/seed:ro
    depends_on:
      ingressa:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.2"
          memory: 768M

  postgres:
    image: postgres:16-alpine
    # 6 backends com 40 conexões cada, mais o worker: o padrão (100) não basta
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: ingressa
      POSTGRES_PASSWORD: ingressa
      POSTGRES_DB: ingressa
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ingressa"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  redis:
    image: redis:7.4-alpine
    # Agora o Redis guarda também a fila de compras, que não pode se perder:
    # - appendonly: cada mudança é gravada em disco, e volta se o Redis reiniciar
    # - volatile-lru: quando a memória enche, só descarta o que tem prazo de
    #   validade (as respostas do cache), nunca a fila
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory", "400mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Gerador de carga. Não sobe com "up"; é usado com:
  #   docker compose run --rm --service-ports k6 run /scripts/estreia.js
  # Painel em tempo real: http://localhost:5665 (o --service-ports publica a porta)
  k6:
    image: grafana/k6:0.54.0
    profiles: ["carga"]
    # Roda com o seu usuário para conseguir salvar o relatório em ./relatorios
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:5665:5665"
    volumes:
      - ../shared/load-tests:/scripts:ro
      - ./relatorios:/relatorios
      # Só leitura: o relatório compara com o último resultado das outras etapas
      - ..:/curso:ro
    environment:
      # O teste entra pela porta da frente, como um usuário
      BASE_URL: http://nginx:80
      ETAPA: "Etapa 08 · Go"
      # O grande final: uma estreia maior, e o hardware que a 07 tem
      USUARIOS: 600
      DEGRAUS: "1,2,4,8,16,32,64,128,192,256,384"
      HARDWARE: "8 CPUs / 8 GB"
      # Ao final, o painel é salvo em relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD_EXPORT: /relatorios/ultimo-teste.html
      K6_WEB_DASHBOARD: "true"
      K6_WEB_DASHBOARD_HOST: 0.0.0.0
      K6_WEB_DASHBOARD_PERIOD: 2s
      # Avisos de requisições que falharam vão para um arquivo, não para a tela
      K6_LOG_OUTPUT: file=/relatorios/k6.log

volumes:
  redis:
