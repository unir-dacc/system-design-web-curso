# O Nginx é a porta de entrada do Ingressa: recebe todas as conexões dos
# usuários e distribui as requisições entre os backends. As regras ficam em
# templates/ingressa.conf.template.

user nginx;

# Um único processo: o Nginx atende milhares de conexões num só event loop.
worker_processes 1;
worker_rlimit_nofile 65536;

error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 20000;
}

http {
    # Sem log de cada requisição: no pico seriam milhares por segundo
    access_log off;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/ingressa.conf;
}
