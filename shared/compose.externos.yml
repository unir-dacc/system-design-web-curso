# Sistemas EXTERNOS ao Ingressa. São incluídos por todas as etapas do curso
# com os mesmos limites e a mesma configuração, para que a comparação entre
# etapas seja justa: o que muda é só a arquitetura do Ingressa.
#
# O comportamento (latência, erros...) é simulado e configurável ao vivo:
#   curl -X PATCH localhost:8001/admin/config -H "Content-Type: application/json" -d '{"latencia_ms": 5000}'
#   ou pelo Swagger: http://localhost:8001/docs (gateway) e http://localhost:8002/docs (cinema)

services:
  gateway-pagamento:
    build: ./gateway-pagamento
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      # Lento: cada cobrança leva ~3 s (análise antifraude, bandeira do cartão...),
      # como um gateway sob a carga de uma grande estreia
      LATENCIA_MS: 3000
      TAXA_RECUSA: 0.05
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  sistema-cinema:
    build: ./sistema-cinema
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - ./seed:/seed:ro
    environment:
      # Rápido: o sistema do cinema não deve ser o gargalo do Ingressa
      LATENCIA_MAPA_MS: 50
      LATENCIA_RESERVA_MS: 40
      LATENCIA_CONFIRMACAO_MS: 30
      MAX_CONCORRENCIA: 200
      RESERVA_TTL_S: 600
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 256M

  # Servidor SMTP falso com interface web: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
